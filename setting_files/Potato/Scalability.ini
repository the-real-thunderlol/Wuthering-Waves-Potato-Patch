; WuWa Potato preset. Target: approximately 2 GB total game VRAM and 1/4 of baseline GPU work.
; Targets require measurement; resolution and frame limit are preserved.

; Group indexes match GameUserSettings.ini. Material enum: 0=Low, 2=Medium.
; Texture pool budget covers only part of total VRAM.

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.40
r.StaticMeshLODDistanceScale=2.50
r.SkeletalMeshLODBias=1

[AntiAliasingQuality@1]
r.PostProcessAAQuality=2

[ShadowQuality@0]
r.ShadowQuality=0

[PostProcessQuality@0]
r.AmbientOcclusionLevels=0
r.AmbientOcclusionMaxQuality=0

[TextureQuality@0]
r.Streaming.PoolSize=512
r.Streaming.MipBias=2
r.MaxAnisotropy=1

[EffectsQuality@0]
fx.Niagara.QualityLevel=0
r.EmitterSpawnRateScale=0.25
r.ParticleLODBias=2
r.TranslucencyLightingVolumeDim=16
r.TranslucencyVolumeBlur=0
r.DetailMode=0

[FoliageQuality@0]
grass.DensityScale=0.00
foliage.DensityScale=0.00
grass.CullDistanceScale=0.40
foliage.CullDistanceScale=0.40

[ShadingQuality@0]
r.MaterialQualityLevel=0

