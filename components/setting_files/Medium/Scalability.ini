; WuWa Medium preset. Target: approximately 4 GB total game VRAM and 1/2 of baseline GPU work.
; Targets require measurement; resolution and frame limit are preserved.

; Group indexes match GameUserSettings.ini. Material enum: 0=Low, 2=Medium.
; Texture pool budget covers only part of total VRAM.

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.80
r.StaticMeshLODDistanceScale=1.25
r.SkeletalMeshLODBias=0

[AntiAliasingQuality@2]
r.PostProcessAAQuality=3

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.MaxResolution=512
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.60
r.Shadow.RadiusThreshold=0.06
r.Shadow.PerObjectShadowMapResolution=512
r.Shadow.PerObjectResolutionMax=512
r.Shadow.PerObjectResolutionMin=256

[PostProcessQuality@1]
r.AmbientOcclusionLevels=1
r.AmbientOcclusionMaxQuality=25

[TextureQuality@2]
r.Streaming.PoolSize=1536
r.Streaming.MipBias=0
r.MaxAnisotropy=4

[EffectsQuality@2]
fx.Niagara.QualityLevel=2
r.EmitterSpawnRateScale=0.75
r.ParticleLODBias=0
r.TranslucencyLightingVolumeDim=32
r.TranslucencyVolumeBlur=0
r.DetailMode=1

[FoliageQuality@2]
grass.DensityScale=0.40
foliage.DensityScale=0.40
grass.CullDistanceScale=0.80
foliage.CullDistanceScale=0.80

[ShadingQuality@2]
r.MaterialQualityLevel=2

