; WuWa Low preset. Target: approximately 3 GB total game VRAM and 1/3 of baseline GPU work.
; Targets require measurement; resolution and frame limit are preserved.

; Group indexes match GameUserSettings.ini. Material enum: 0=Low, 2=Medium.
; Texture pool budget covers only part of total VRAM.

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.60
r.StaticMeshLODDistanceScale=1.75
r.SkeletalMeshLODBias=1

[AntiAliasingQuality@1]
r.PostProcessAAQuality=2

[ShadowQuality@0]
r.ShadowQuality=0

[PostProcessQuality@0]
r.AmbientOcclusionLevels=0
r.AmbientOcclusionMaxQuality=0

[TextureQuality@1]
r.Streaming.PoolSize=1024
r.Streaming.MipBias=1
r.MaxAnisotropy=2

[EffectsQuality@1]
fx.Niagara.QualityLevel=1
r.EmitterSpawnRateScale=0.50
r.ParticleLODBias=1
r.TranslucencyLightingVolumeDim=24
r.TranslucencyVolumeBlur=0
r.DetailMode=0

[FoliageQuality@1]
grass.DensityScale=0.15
foliage.DensityScale=0.15
grass.CullDistanceScale=0.60
foliage.CullDistanceScale=0.60

[ShadingQuality@1]
r.MaterialQualityLevel=0

